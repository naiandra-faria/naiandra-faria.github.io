<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<li style="position:relative; list-style:none">
  <a href="{{ href }}" download="{{ dl }}" onMouseEnter="{{ enter }}" onMouseLeave="{{ leave }}" style="position:relative; display:inline-block; padding:4px 2px; font-family:'DM Mono',monospace; font-size:11px; letter-spacing:.15em; text-transform:uppercase; text-decoration:none; transition:color .2s; color:{{ color }}" style-hover="color:#1C1410">
    <span style="position:absolute; left:-4px; right:-4px; bottom:1px; height:9px; border-radius:2px; background:#F0C93A; transform:rotate(-1.5deg); z-index:0; pointer-events:none; transition:opacity .25s; opacity:{{ highlight }}"></span>
    <span style="position:relative; z-index:1">{{ label }}</span>
    <span style="position:absolute; inset:-7px; border:1px dashed #8B1A2E; border-radius:1px; pointer-events:none; transition:opacity .2s; opacity:{{ frame }}"></span>
    <span style="position:absolute; top:-10px; left:-10px; width:6px; height:6px; background:#FAF7F0; border:1.5px solid #8B1A2E; pointer-events:none; transition:opacity .2s; opacity:{{ frame }}"></span>
    <span style="position:absolute; top:-10px; right:-10px; width:6px; height:6px; background:#FAF7F0; border:1.5px solid #8B1A2E; pointer-events:none; transition:opacity .2s; opacity:{{ frame }}"></span>
    <span style="position:absolute; bottom:-10px; left:-10px; width:6px; height:6px; background:#FAF7F0; border:1.5px solid #8B1A2E; pointer-events:none; transition:opacity .2s; opacity:{{ frame }}"></span>
    <span style="position:absolute; bottom:-10px; right:-10px; width:6px; height:6px; background:#FAF7F0; border:1.5px solid #8B1A2E; pointer-events:none; transition:opacity .2s; opacity:{{ frame }}"></span>
  </a>
</li>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:80},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;About&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;download&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string | false&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;forceHover&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Docs&quot;}}">
class Component extends DCLogic {
  state = { hover: false };

  renderVals() {
    const active = this.props.active === true || this.props.active === 'true';
    const forceHover = this.props.forceHover === true || this.props.forceHover === 'true';
    const hover = this.state.hover || forceHover;
    return {
      label: this.props.label ?? 'Item',
      href: this.props.href ?? '#',
      dl: this.props.download || false,
      color: active ? '#1C1410' : '#8A7A6A',
      highlight: active ? 1 : 0,
      frame: active ? 1 : (hover ? 0.45 : 0),
      enter: () => this.setState({ hover: true }),
      leave: () => this.setState({ hover: false })
    };
  }
}
</script>
</body>
</html>
